# Simple workflow for deploying static content to GitHub Pages
name: Deploy application to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '20.20.2'
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Check
        run: vp check
      - name: Build Application
        # RR 7 prerenders from its own SSR-pass writeBundle hook, which the
        # vite-plus built-in `vp build` never triggers (isSsrBuild gate);
        # `vpr build` runs the package.json script (`react-router build`),
        # React Router's canonical two-pass builder.
        run: vpr build
        timeout-minutes: 5
      - name: Surface prerendered index at artifact root
        # RR7 prerenders basename-mirrored (build/client/siri-color-picker/
        # index.html), but GitHub Pages project sites map the artifact ROOT
        # to https://<user>.github.io/siri-color-picker/ — with the index in
        # the subdir the canonical URL 404s (verified live). Move it up;
        # asset refs inside are base-prefixed absolutes (/siri-color-picker/
        # assets/...), so they resolve correctly from the artifact root.
        run: mv build/client/siri-color-picker/index.html build/client/index.html
      - name: Build development snapshot
        # Unminified, sourcemapped build with development React (readable
        # component names) for React DevTools profiling, served at
        # /siri-color-picker/dev/. DEV_SNAPSHOT=1 switches basename/base and
        # the output directory (dist/dev, so the production build/ above —
        # already relocated by the step before — stays untouched) via
        # react-router.config.ts + vite.config.ts; NODE_ENV=development makes
        # Vite statically replace process.env.NODE_ENV with "development" in
        # the bundle, shipping React's dev builds.
        run: DEV_SNAPSHOT=1 NODE_ENV=development vpr build
        timeout-minutes: 5
      - name: Copy development snapshot into artifact
        # RR7 prerenders basename-mirrored inside the snapshot's own outDir
        # (dist/dev/client/siri-color-picker/dev/index.html), but Pages serves
        # build/client/dev/* at /siri-color-picker/dev/*. Copy the snapshot's
        # client output under dev/, surfacing its index.html at that root and
        # dropping the basename-mirrored dir (that index is its only content).
        run: |
          mkdir -p build/client/dev
          cp -r dist/dev/client/. build/client/dev/
          mv build/client/dev/siri-color-picker/dev/index.html build/client/dev/index.html
          rm -rf build/client/dev/siri-color-picker
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          # React Router 7 prerenders basename-mirrored, but the step above
          # relocates index.html to the artifact root (Pages project sites map
          # the artifact root to /siri-color-picker/). Assets stay at
          # build/client/assets and serve at /siri-color-picker/assets/* via
          # the base-prefixed absolute refs inside index.html.
          path: './build/client'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
